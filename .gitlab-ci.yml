stages:
  - build

build-slm-image:
  stage: build
  # Official stable Buildah image
  image: quay.io/buildah/stable:v1.43

  variables:
    CUSTOM_REGISTRY: "gitlab-registry.ncs-cloud.lan"
    CUSTOM_REGISTRY_IMAGE: "gitlab-registry.ncs-cloud.lan/ml/smoke-test"
    KUBERNETES_NAMESPACE: "gitlab-runner"
    KUBERNETES_SERVICE_ACCOUNT: "gitlab-runner"
  before_script:
    # Buildah requires an isolated storage driver configuration when running inside a container
    # 1. Force the engine to use filesystem-only chroot jail extraction
    export BUILDAH_ISOLATION=chroot
    export BUILDAH_LAYERS=false
    
    # 2. Redirect the storage engine to a directory owned by the unprivileged user
    export STORAGE_DRIVER=vfs
    export CONTAINER_STORAGE_CONF="${CI_PROJECT_DIR}/storage.conf"
    
    mkdir -p "${CI_PROJECT_DIR}/containers/storage"
    echo -e "[storage]\ndriver = \"vfs\"\nrunroot = \"${CI_PROJECT_DIR}/containers/runroot\"\ngraphroot = \"${CI_PROJECT_DIR}/containers/storage\"" > "${CONTAINER_STORAGE_CONF}"
    
    # 3. Write search registries configuration locally
    export CONTAINER_REGISTRIES_CONF="${CI_PROJECT_DIR}/registries.conf"
    echo -e "unqualified-search-registries = [\"docker.io\", \"quay.io\"]" > "${CONTAINER_REGISTRIES_CONF}"
  script:
    # 1. Pass the tls flag explicitly to the login step
    - buildah login --tls-verify=false --username "${CI_REGISTRY_USER}" --password "${CI_REGISTRY_PASSWORD}" "${CUSTOM_REGISTRY}"
    
    # 2. Build the image matrix
    - buildah bud 
      --tls-verify=false 
      -t "${CUSTOM_REGISTRY_IMAGE}:latest" 
      -t "${CUSTOM_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" 
      "${CI_PROJECT_DIR}"
    
    # 3. Push to registry
    - buildah push --tls-verify=false "${CUSTOM_REGISTRY_IMAGE}:latest"
    - buildah push --tls-verify=false "${CUSTOM_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"