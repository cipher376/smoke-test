stages:
  - build

build-slm-image:
  stage: build
  # Kaniko's debug image variant contains a shell interpreter required by GitLab Runner
  image:
    name: gcr.io/kaniko-project/executor:v1.20.0-debug
    entrypoint: [""]

  variables:
    CUSTOM_REGISTRY: "gitlab-registry.ncs-cloud.lan"
    CUSTOM_REGISTRY_IMAGE: "gitlab-registry.ncs-cloud.lan/ml/smoke-test"
    KUBERNETES_NAMESPACE: "gitlab-runner"
    KUBERNETES_SERVICE_ACCOUNT: "gitlab-runner"

  before_script:
    # Set up Kaniko's configuration matrix matching your custom registry credentials
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CUSTOM_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json

  script:
    # Kaniko untars layers, compiles code, and pushes images completely in user-space
    - /kaniko/executor \
      --context "${CI_PROJECT_DIR}" \
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
      --destination "${CUSTOM_REGISTRY_IMAGE}:latest" \
      --destination "${CUSTOM_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
      --skip-unused-stages \
      --insecure \
      --insecure-registry "${CUSTOM_REGISTRY}"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"