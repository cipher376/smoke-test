stages:
  - build

build-slm-image:
  stage: build
  # Official stable Buildah image
  image: quay.io/buildah/stable:v1.43

  variables:
    CUSTOM_REGISTRY: "gitlab-registry.ncs-cloud.lan"
    CUSTOM_REGISTRY_IMAGE: "gitlab-registry.ncs-cloud.lan/ml/smoke-test"
    # FIX 2: Prevents the runner from defaulting or wandering into 'default'
    KUBERNETES_NAMESPACE: "gitlab-runner"
    KUBERNETES_SERVICE_ACCOUNT: "gitlab-runner"
  before_script:
    # Buildah requires an isolated storage driver configuration when running inside a container
    - export STORAGE_DRIVER=vfs
  script:
    # 1. Log directly into your private OpenStack GitLab Registry
    - buildah login --username "${CI_REGISTRY_USER}" --password "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    
    # 2. Build the image layer using your local Dockerfile context 
    # (--tls-verify=false handles your internal .lan self-signed or private cert setup)
    - buildah bud 
      --tls-verify=false 
      -t "${CI_REGISTRY_IMAGE}:latest" 
      -t "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" 
      "${CI_PROJECT_DIR}"
    
    # 3. Push both target tags directly to your registry
    - buildah push --tls-verify=false "${CI_REGISTRY_IMAGE}:latest"
    - buildah push --tls-verify=false "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"