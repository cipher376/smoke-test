stages:
  - build

build-slm-image:
  stage: build
  # Switched to Kaniko's latest stable debug image (includes the shell required by GitLab)
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  variables:
    CUSTOM_REGISTRY: "gitlab-registry.ncs-cloud.lan"
    CUSTOM_REGISTRY_IMAGE: "gitlab-registry.ncs-cloud.lan/ml/smoke-test"
    KUBERNETES_NAMESPACE: "gitlab-runner"
    KUBERNETES_SERVICE_ACCOUNT: "gitlab-runner"

  before_script:
    # Authenticate to your custom registry by writing the Docker config directly into Kaniko's workspace
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CUSTOM_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json

  script:
    # Kaniko handles building and pushing multiple tags to your insecure local registry in a single pass
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CUSTOM_REGISTRY_IMAGE}:latest"
      --destination "${CUSTOM_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --skip-unused-stages
      --insecure
      --insecure-registry "${CUSTOM_REGISTRY}"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"